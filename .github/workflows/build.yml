# GitHub Actions workflow to build, verify and draft a release of the theme plugin:
# - build the plugin and run the structure/configuration verifications,
# - run IntelliJ Plugin Verifier,
# - create a draft release.
#
# Docs:
# - GitHub Actions: https://docs.github.com/actions
# - IntelliJ Platform Gradle Plugin: https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin.html

name: Build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Also validates the Gradle Wrapper checksum
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Export Properties
        id: properties
        shell: bash
        run: |
          PROPERTIES="$(./gradlew properties --console=plain -q)"
          VERSION="$(echo "$PROPERTIES" | grep "^version:" | cut -f2- -d ' ')"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Plugin Structure
        run: ./gradlew verifyPluginProjectConfiguration verifyPluginStructure

      - name: Build Plugin
        run: ./gradlew buildPlugin

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-artifact
          path: ./build/distributions/*.zip
          if-no-files-found: error

  # Verify the plugin using IntelliJ Plugin Verifier
  verify:
    name: Verify
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Plugin Verifier
        run: ./gradlew verifyPlugin

  # Prepare a draft release for the manual verification
  releaseDraft:
    name: Release Draft
    if: github.event_name == 'push'
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: plugin-artifact

      - name: Remove Old Release Drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == true) | .id' \
            | xargs -r -I '{}' gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/{}"

      - name: Create Release Draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew getChangelog --unreleased --no-header --console=plain -q > changelog.md
          gh release create "v${{ needs.build.outputs.version }}" \
            --draft \
            --title "v${{ needs.build.outputs.version }}" \
            --notes-file changelog.md \
            ./*.zip